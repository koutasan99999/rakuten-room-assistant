<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bf0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ROOM発掘">
  <title>ROOM商品発掘</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>ROOM商品発掘</h1>
    <p class="lead">楽天市場から投稿向きの商品を探して、紹介文まで用意します。</p>
  </header>

  <main class="container">
    <button type="button" id="discover-btn" class="btn btn-discover">商品を発掘する</button>

    <div id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>商品を探しています…<br><span class="sub">AIが選ぶまで10〜30秒ほどかかります</span></p>
    </div>

    <div id="message" class="message" role="alert" hidden></div>

    <p id="genre" class="genre" hidden></p>
    <div id="results" class="results"></div>
  </main>

  <footer class="footer">
    <p>紹介文は商品ページの情報と合っているか確認してから投稿してください。</p>
    <button type="button" id="reset-passcode" class="link-btn" hidden>合言葉を入れ直す</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
