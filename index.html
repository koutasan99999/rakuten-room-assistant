<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bf0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ROOM発掘">
  <title>ROOM商品発掘</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>ROOM商品発掘</h1>
    <p class="lead">楽天市場から投稿向きの商品を探して、紹介文まで用意します。</p>
  </header>

  <main class="container">
    <section class="search-box" aria-label="発掘条件">
      <label class="field">
        <span class="field-label">ジャンル</span>
        <select id="genre-select" class="select">
          <option value="">おまかせ</option>
          <option value="useful">便利グッズ</option>
          <option value="appliance">家電</option>
          <option value="gadget">ガジェット</option>
          <option value="interior">インテリア</option>
          <option value="storage">収納</option>
          <option value="kitchen">キッチン</option>
          <option value="tableware">食器</option>
          <option value="fashion">ファッション</option>
          <option value="shoes">靴</option>
          <option value="bag">バッグ</option>
          <option value="perfume">香水</option>
          <option value="beauty">美容</option>
          <option value="health">健康・ダイエット</option>
          <option value="travel">旅行</option>
          <option value="outdoor">アウトドア</option>
          <option value="gift">プレゼント</option>
          <option value="food">食品</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">選び方の型</span>
        <select id="curate-type" class="select">
          <option value="">指定なし（単品で発掘）</option>
          <option value="first_pick">まず1個買うなら</option>
          <option value="beginner">初心者向け</option>
          <option value="premium_budget">本命＋安い代替</option>
          <option value="budget_tiers">予算別</option>
          <option value="gift">プレゼント</option>
          <option value="use_case">用途別</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">自由入力 <span class="optional">任意</span></span>
        <textarea id="free-text" class="textarea" rows="2" maxlength="120" placeholder="例：30代男性へのプレゼント、1万円以下"></textarea>
      </label>
      <button type="button" id="search-btn" class="btn btn-discover">この条件で発掘する</button>
    </section>

    <div class="random-box">
      <button type="button" id="discover-btn" class="btn btn-random">おまかせで発掘</button>
      <p class="random-note">条件なしで、何が出るか分からない発掘をします</p>
    </div>

    <div id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>商品を探しています…<br><span class="sub">AIが選ぶまで10〜50秒ほどかかります</span></p>
    </div>

    <div id="message" class="message" role="alert" hidden></div>

    <p id="genre" class="genre" hidden></p>
    <div id="results" class="results"></div>
  </main>

  <footer class="footer">
    <p>紹介文は商品ページの情報と合っているか確認してから投稿してください。</p>
    <button type="button" id="reset-passcode" class="link-btn" hidden>合言葉を入れ直す</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
