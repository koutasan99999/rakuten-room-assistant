# 自律運営の手動の実行（2026-11-15）：本番のアプリの /api/worker を1回呼ぶ（AI社員の仕事を1段階だけ進める）。
# 公開リポジトリの GitHub Actions は無料。実行は数秒（curl だけ）。
# 必要な設定（リポジトリの Settings → Secrets and variables → Actions → Secrets）：
#   WORKER_URL  … 本番のアプリのURL（例：https://xxxx.vercel.app）
#   CRON_SECRET … Vercel の環境変数 CRON_SECRET と同じ値
# どちらかが無ければ、何もせずに終わる（失敗にしない）。
name: worker
# 2026-11-16：GitHub の定期実行（schedule）は、11/13 に約7時間待っても一度も起動しなかったため外した。
# 15分ごとの定期実行は QStash（Upstash の無料枠）が担当する。ここは手動の実行（動作確認）だけに使う（二重の定期実行をしない）。
on:
  workflow_dispatch: {}
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: AI社員の仕事を1段階進める
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "WORKER_URL か CRON_SECRET が未設定のため、何もしません"; exit 0; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 -X POST "${WORKER_URL%/}/api/worker" -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' -H "X-Trigger: ${{ github.event_name }}" -d '{"action":"tick"}' || echo 000)
          echo "起動のきっかけ: ${{ github.event_name }}（schedule＝定期実行／workflow_dispatch＝手動）"
          echo "HTTP $code"
          # 結果の要約（AIの呼び出しの細かい記録は省く）。読めなければ先頭だけ出す
          jq -c 'del(.aiUsage) | if .worked then .worked |= del(.openaiIds) + {ids: (.openaiIds // [] | length)} else . end' out.json 2>/dev/null || head -c 1500 out.json || true
          echo
          { echo "### 起動：${{ github.event_name }}・HTTP $code"; echo '```'; jq -c 'del(.aiUsage)' out.json 2>/dev/null | head -c 3000; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" != "200" ]; then exit 1; fi
