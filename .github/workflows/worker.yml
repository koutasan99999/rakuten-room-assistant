# 自律運営の定期実行（2026-11-15）：15分ごとに、本番のアプリの /api/worker を1回呼ぶ（AI社員の仕事を1段階だけ進める）。
# 公開リポジトリの GitHub Actions は無料。実行は数秒（curl だけ）。
# 必要な設定（リポジトリの Settings → Secrets and variables → Actions → Secrets）：
#   WORKER_URL  … 本番のアプリのURL（例：https://xxxx.vercel.app）
#   CRON_SECRET … Vercel の環境変数 CRON_SECRET と同じ値
# どちらかが無ければ、何もせずに終わる（失敗にしない）。
name: worker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: AI社員の仕事を1段階進める
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "WORKER_URL か CRON_SECRET が未設定のため、何もしません"; exit 0; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 -X POST "${WORKER_URL%/}/api/worker" -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' -d '{"action":"tick"}' || echo 000)
          echo "HTTP $code"
          head -c 600 out.json || true
          echo
          if [ "$code" != "200" ]; then exit 1; fi
