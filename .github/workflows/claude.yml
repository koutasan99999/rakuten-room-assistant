# Claude Code（GitHub Actions）：Issue・コメントに「@claude」と書いた依頼を受けて、作業ブランチで実装し、npm test を実行してPRを作る（2026-11-18）
# 公式：anthropics/claude-code-action@v1（https://github.com/anthropics/claude-code-action の examples/claude.yml をもとに最小権限で設定）
# - 動かせるのは、このリポジトリに書き込み権限のある人だけ（アクションが依頼者の権限を確かめる。ボット・GitHub Appからの依頼は受けない：allowed_bots は設定しない）
# - 認証：CLAUDE_CODE_OAUTH_TOKEN（社長の Claude の契約の範囲で動く。API の従量課金は発生しない）。値は Secrets にだけ置く（ログ・コードに出さない）
#   ※ ANTHROPIC_API_KEY（従量課金）は、社長の承認なしに使わない
# - しないこと：main への直接の push・自動マージ、本番へのデプロイ操作、Instagram・楽天ROOMへの投稿・コメント・フォロー、秘密の値の表示
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check credential
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::Secrets に CLAUDE_CODE_OAUTH_TOKEN が未設定です（Mac で claude setup-token を実行して作った値を登録してください）"; exit 1; fi
          echo "認証の設定あり（値は表示しない）"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm test),Bash(npm ci),Bash(npm install),Bash(node --test:*),Bash(node --check:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Bash(vercel:*),Bash(gh pr merge:*),Bash(git push --force:*)"
            --append-system-prompt "このリポジトリの CLAUDE.md の決まりに従う。社長への報告は日本語で平易に、事実だけ。作業は作業ブランチだけで行い、main へ直接 push しない・マージしない・本番へデプロイしない。npm test を実行して結果（成功・失敗の件数）を必ずコメントに書く。テストは RAKUTEN_GAP_MS=0 V1_ENABLED=1 AI_IMAGE_GEN=1 の設定で npm test が動く。Instagram・楽天ROOM・外部への投稿・コメント・フォローをするコードや操作を、人間の承認なしに動くようにしない。秘密の鍵の値をコード・コメント・ログに書かない。"

      # 失敗したときだけ、エラーの内容を表示する（認証情報らしき文字列は伏せ字。秘密の値はこの段階に渡さない）
      # 公式のアクションは安全のため内容を隠すので、原因（例：Not logged in・401）が分かるようにする（2026-11-19）
      - name: Show error summary (credentials are never printed)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          git show "${GITHUB_SHA}:scripts/claude-diag.py" > "$RUNNER_TEMP/claude-diag.py"  # Claude が作業中に書き換えた版ではなく、起動時の版を使う
          python3 -I "$RUNNER_TEMP/claude-diag.py" "$EXEC_FILE" claude
          echo "401・Not logged in なら、Secrets の CLAUDE_CODE_OAUTH_TOKEN が Anthropic に受け付けられていない（Actions の「Claude Code diagnose」で確かめられる）"

      # 公式のアクションはブランチに commit するところまで（PRは作らない）。作業ブランチに変更があれば、PRを作る（マージはしない）
      - name: Open a pull request for Claude's branch
        if: always() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then echo "ブランチ $BRANCH はまだ push されていない（変更なし）"; exit 0; fi
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[0].number')" ]; then echo "PRはもうある"; exit 0; fi
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" --jq '.ahead_by' || echo 0)
          if [ "${ahead:-0}" = "0" ]; then echo "main との差が無いので PR は作らない"; exit 0; fi
          body="Claude Code（GitHub Actions）が作ったPRです。${ISSUE:+Issue #${ISSUE} の依頼。Closes #${ISSUE}}

          - 自動ではマージしません（人が確認してから取り込む）
          - テストの結果は Issue のコメントを見てください"
          if ! out=$(gh pr create --base main --head "$BRANCH" --title "Claude: ${TITLE:-作業}" --body "$body" 2>&1); then
            echo "$out"
            if echo "$out" | grep -q "not permitted to create or approve pull requests"; then
              # リポジトリの設定「Allow GitHub Actions to create and approve pull requests」がオフ。作業とテストは終わっているので失敗にしない
              echo "::warning::リポジトリの設定で、GitHub Actions からの PR 作成が許可されていません（Settings → Actions → General → Workflow permissions）。Issue のコメントの「Create PR」から作れます"
              exit 0
            fi
            exit 1
          fi
          echo "$out"
